<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EasySalon Agent</title>
  <link rel="icon" type="image/png" href="/images/logo.png">
  <link rel="shortcut icon" type="image/png" href="/images/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500;600&display=swap"
    rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Be Vietnam Pro"', 'Inter', 'system-ui', '-apple-system', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace']
          }
        }
      }
    };
    mermaid.initialize({ startOnLoad: false, theme: 'default', securityLevel: 'loose' });

    window.TABS = ['task', 'jira', 'branch', 'log', 'notes', 'diagram', 'settings'];
    window.TAB_ROUTES = {
      'task': '/task',
      'jira': '/jira',
      'branch': '/git-control',
      'log': '/history',
      'notes': '/notes',
      'diagram': '/diagram',
      'settings': '/settings'
    };

    window.GIT_SUBTAB_ROUTES = {
      'pull_sync': '/git-control',
      'branch': '/git-control/checkout-branch',
      'switch': '/git-control/switch-branch',
      'cherry_pick': '/git-control/cherry-pick',
      'merge': '/git-control/merge'
    };

    window.SETTINGS_SUBTAB_ROUTES = {
      'engine': '/settings/engine',
      'model': '/settings/model',
      'effort': '/settings/effort',
      'mcp': '/settings/mcp',
      'account': '/settings/account',
      'api': '/settings/api',
      'env': '/settings/env'
    };

    window.ROUTE_TO_SETTINGS_SUBTAB = {
      '/settings': 'engine',
      '/settings/': 'engine',
      '/setting': 'engine',
      '/settings/engine': 'engine',
      '/engine/settings': 'engine',
      '/engine': 'engine',
      '/settings/model': 'model',
      '/settings/models': 'model',
      '/model/settings': 'model',
      '/model': 'model',
      '/models': 'model',
      '/settings/effort': 'effort',
      '/effort/settings': 'effort',
      '/effort': 'effort',
      '/settings/mcp': 'mcp',
      '/mcp/settings': 'mcp',
      '/mcp': 'mcp',
      '/mcp-servers': 'mcp',
      '/settings/account': 'account',
      '/account/settings': 'account',
      '/account': 'account',
      '/settings/api': 'api',
      '/settings/api-keys': 'api',
      '/api-keys/settings': 'api',
      '/api-settings': 'api',
      '/api-keys': 'api',
      '/settings/env': 'env',
      '/settings/environment': 'env',
      '/env/settings': 'env',
      '/env': 'env'
    };

    window.ROUTE_TO_GIT_SUBTAB = {
      '/git-control': 'pull_sync',
      '/git-control/': 'pull_sync',
      '/git-control/pull-sync': 'pull_sync',
      '/git-control/sync': 'pull_sync',
      '/git-control/checkout-branch': 'branch',
      '/git-control/create-branch': 'branch',
      '/git-control/branch': 'branch',
      '/git-control/branches': 'branch',
      '/git-control/switch-branch': 'switch',
      '/git-control/switch': 'switch',
      '/git-control/checkout': 'switch',
      '/git-control/cherry-pick': 'cherry_pick',
      '/git-control/cherry': 'cherry_pick',
      '/git-control/merge': 'merge',
      '/branch': 'branch',
      '/branches': 'branch',
      '/switch': 'switch',
      '/switch-branch': 'switch',
      '/cherry-pick': 'cherry_pick',
      '/cherry': 'cherry_pick',
      '/git/cherry-pick': 'cherry_pick',
      '/merge': 'merge',
      '/git-merge': 'merge',
      '/git/merge': 'merge'
    };

    window.ROUTE_TO_TAB = {
      '/': 'task',
      '/index.html': 'task',
      '/task': 'task',
      '/tasks': 'task',
      '/jira': 'jira',
      '/jira-tasks': 'jira',
      '/jira-tickets': 'jira',
      '/git-control': 'branch',
      '/git': 'branch',
      '/branch': 'branch',
      '/branches': 'branch',
      '/cherry-pick': 'branch',
      '/cherry': 'branch',
      '/git/cherry-pick': 'branch',
      '/merge': 'branch',
      '/git-merge': 'branch',
      '/git/merge': 'branch',
      '/history': 'log',
      '/log': 'log',
      '/logs': 'log',
      '/diagram': 'diagram',
      '/architecture': 'diagram',
      '/settings': 'settings',
      '/setting': 'settings',
      '/settings/effort': 'settings',
      '/settings/model': 'settings',
      '/settings/models': 'settings',
      '/model/settings': 'settings',
      '/models/settings': 'settings',
      '/model': 'settings',
      '/models': 'settings',
      '/settings/engine': 'settings',
      '/settings/account': 'settings',
      '/account/settings': 'settings',
      '/account': 'settings',
      '/settings/api': 'settings',
      '/settings/api-keys': 'settings',
      '/settings/env': 'settings',
      '/settings/environment': 'settings',
      '/effort/settings': 'settings',
      '/engine/settings': 'settings',
      '/api-keys/settings': 'settings',
      '/env/settings': 'settings',
      '/effort': 'settings',
      '/engine': 'settings',
      '/api-settings': 'settings',
      '/api-keys': 'settings',
      '/settings/mcp': 'settings',
      '/mcp/settings': 'settings',
      '/mcp': 'settings',
      '/mcp-servers': 'settings',
      '/env': 'settings'
    };

    window.getTabFromUrl = function () {
      try {
        const pathname = (window.location.pathname || '/').replace(/\/+$/, '') || '/';
        if (window.ROUTE_TO_SETTINGS_SUBTAB && window.ROUTE_TO_SETTINGS_SUBTAB[pathname]) {
          window.initSettingsSubTab = window.ROUTE_TO_SETTINGS_SUBTAB[pathname];
          return 'settings';
        }
        if (pathname.startsWith('/settings')) {
          const sub = pathname.replace(/^\/settings\/?/, '');
          if (sub && ['effort', 'model', 'engine', 'account', 'api', 'env', 'mcp'].includes(sub)) {
            window.initSettingsSubTab = sub;
          } else {
            window.initSettingsSubTab = 'effort';
          }
          return 'settings';
        }
        if (window.ROUTE_TO_GIT_SUBTAB && window.ROUTE_TO_GIT_SUBTAB[pathname]) {
          window.initGitSubTab = window.ROUTE_TO_GIT_SUBTAB[pathname];
          return 'branch';
        }
        if (pathname.startsWith('/git-control')) {
          window.initGitSubTab = 'pull_sync';
          return 'branch';
        }
        if (window.ROUTE_TO_TAB[pathname]) return window.ROUTE_TO_TAB[pathname];
      } catch (e) { }
      return null;
    };

    // Xác định tab ban đầu ngay tại <head> để tránh giật giao diện (flicker)
    (function () {
      let initTab = window.getTabFromUrl();
      const path = (window.location.pathname || '/').replace(/\/+$/, '') || '/';
      if (!initTab || path === '/' || path === '/index.html') {
        try {
          const saved = localStorage.getItem('activeAgentStudioTab');
          if (saved && window.TABS.includes(saved)) initTab = saved;
        } catch (e) { }
      }
      if (!initTab || !window.TABS.includes(initTab)) initTab = 'task';
      window.activeTab = initTab;

      // Nhúng style tức thì nếu tab không phải 'task'
      if (initTab !== 'task') {
        const displayVal = initTab === 'jira' ? 'flex' : 'block';
        document.write('<style id="initialTabStyle">#view_task{display:none!important}#view_' + initTab + '{display:' + displayVal + '!important;flex-direction:column!important}#tabBtn_task{background:transparent!important;color:#cbd5e1!important;font-weight:500!important}#tabBtn_' + initTab + '{background:#fff!important;color:#182c4f!important;font-weight:700!important}</style>');
      }
      if (initTab === 'branch') {
        const sub = (window.ROUTE_TO_GIT_SUBTAB && window.ROUTE_TO_GIT_SUBTAB[path]) || window.initGitSubTab || 'pull_sync';
        window.initGitSubTab = sub;
        if (sub !== 'pull_sync') {
          document.write('<style id="initialGitSubTabStyle">#gitSubView_pull_sync{display:none!important}#gitSubView_' + sub + '{display:block!important}#gitSubTabBtn_pull_sync{background:transparent!important;color:#cbd5e1!important;font-weight:500!important}#gitSubTabBtn_' + sub + '{background:rgb(25,156,255)!important;color:#ffffff!important;font-weight:700!important}</style>');
        }
      }
      if (initTab === 'settings') {
        const sub = (window.ROUTE_TO_SETTINGS_SUBTAB && window.ROUTE_TO_SETTINGS_SUBTAB[path]) || window.initSettingsSubTab || 'engine';
        window.initSettingsSubTab = sub;
        if (sub !== 'engine') {
          document.write('<style id="initialSettingsSubTabStyle">#settingsPanel_engine{display:none!important}#settingsPanel_' + sub + '{display:block!important}#settingsNav_engine{background:#0c1628!important;border-color:rgba(36,65,112,0.4)!important;color:#94a3b8!important;box-shadow:none!important}#settingsNav_' + sub + '{background:#1677ff!important;border-color:#1677ff!important;color:#ffffff!important;box-shadow:0 4px 14px rgba(22,119,255,0.35)!important}</style>');
        }
      }
    })();
  </script>
  <style id="studioMainStyles">
    /* {{STUDIO_CSS}} */
    @keyframes bellRing {
      0% {
        transform: rotate(0);
      }

      10% {
        transform: rotate(14deg);
      }

      20% {
        transform: rotate(-14deg);
      }

      30% {
        transform: rotate(12deg);
      }

      40% {
        transform: rotate(-12deg);
      }

      50% {
        transform: rotate(8deg);
      }

      60% {
        transform: rotate(-8deg);
      }

      70% {
        transform: rotate(4deg);
      }

      80% {
        transform: rotate(-4deg);
      }

      90% {
        transform: rotate(2deg);
      }

      100% {
        transform: rotate(0);
      }
    }

    .animate-bell-ring {
      display: inline-block;
      animation: bellRing 1.2s cubic-bezier(0.36, 0.07, 0.19, 0.97) infinite;
      transform-origin: top center;
    }
  </style>
</head>

<body class="min-h-screen font-sans flex flex-col">
  <script>
    (function () {
      var t = localStorage.getItem('easysalon_theme') || 'light';
      document.body.classList.add(t === 'dark' ? 'dark-mode' : 'light-mode');
      if (t === 'dark') document.documentElement.classList.add('dark');
      else document.documentElement.classList.remove('dark');
    })();
  </script>

<!-- {{VIEW:header}} -->

<!-- {{VIEW:tab_logs}} -->
<!-- {{VIEW:tab_notes}} -->
<!-- {{VIEW:tab_diagram}} -->
<!-- {{VIEW:tab_settings}} -->
<!-- {{VIEW:modals}} -->
  <script id="studioMainScript">
    /* {{STUDIO_JS}} */
  </script>
</body>

</html>
