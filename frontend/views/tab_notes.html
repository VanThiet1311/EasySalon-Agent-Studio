  <!-- TAB 6: GHI CHÚ (NOTES & TECHNICAL SCRATCHPAD) -->
  <main id="view_notes" class="hidden flex-1 max-w-7xl w-full mx-auto p-4 md:p-6 space-y-4">
    <!-- Top Action Banner -->
    <div
      class="notes-banner flex flex-wrap items-center justify-between gap-4 bg-[#101e38] border border-[#244170] rounded-lg p-4 shadow-sm">
      <div class="flex items-center gap-3">
        <div
          class="notes-banner-icon w-8 h-8 rounded bg-[#182c4f] border border-[#244170] flex items-center justify-center text-blue-400">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
          </svg>
        </div>
        <div>
          <h2 class="notes-banner-title text-sm font-semibold text-white font-sans">Sổ tay ghi chú & Kỹ thuật</h2>
          <p class="notes-banner-desc text-xs text-slate-400 font-sans">Lưu trữ checklist, lưu ý kỹ thuật, API và thông tin dự án (tự động đồng bộ trên server & localStorage)</p>
        </div>
      </div>

      <div class="flex flex-wrap items-center gap-2">
        <button type="button" id="btnNewNote" onclick="createNewNote()"
          class="px-3.5 py-1.5 text-xs font-sans font-medium rounded-lg transition flex items-center gap-1.5 cursor-pointer shadow-sm">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 5v14M5 12h14" />
          </svg>
          <span>Tạo ghi chú mới</span>
        </button>

        <button type="button" id="btnSendNoteToTask" onclick="sendActiveNoteToTask()"
          class="px-3 py-1.5 text-xs font-sans font-medium rounded-lg transition flex items-center gap-1.5 cursor-pointer"
          title="Đưa toàn bộ nội dung ghi chú này vào ô yêu cầu của Agent ở trang Tác vụ">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z" />
          </svg>
          <span>Đưa vào Tác vụ</span>
        </button>

        <button type="button" id="btnCopyNote" onclick="copyActiveNote()"
          class="px-3 py-1.5 text-xs font-sans font-medium rounded-lg transition flex items-center gap-1.5 cursor-pointer"
          title="Sao chép nội dung ghi chú vào bộ nhớ tạm">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" />
          </svg>
          <span>Sao chép</span>
        </button>

        <button type="button" id="btnExportNote" onclick="exportActiveNoteMarkdown()"
          class="px-3 py-1.5 text-xs font-sans font-medium rounded-lg transition flex items-center gap-1.5 cursor-pointer"
          title="Tải nội dung ghi chú dưới dạng tệp Markdown (.md)">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
          </svg>
          <span>Tải .md</span>
        </button>

        <button type="button" id="btnDeleteNote" onclick="deleteActiveNote()"
          class="px-3 py-1.5 text-xs font-sans font-medium rounded-lg transition flex items-center gap-1.5 cursor-pointer"
          title="Xóa vĩnh viễn ghi chú hiện tại">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
          </svg>
          <span>Xóa</span>
        </button>
      </div>
    </div>

    <!-- Main 2-Column Notes Workspace -->
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-4 items-start">
      <!-- Left Panel: Danh sách ghi chú & Tìm kiếm (4 cols) -->
      <div class="notes-panel lg:col-span-4 bg-[#101e38] border border-[#244170] rounded-xl p-3.5 space-y-3 shadow-sm flex flex-col">
        <!-- Search & Filter -->
        <div class="space-y-2">
          <div class="relative">
            <input type="text" id="notesSearchInput" oninput="renderNotesList()"
              placeholder="Tìm kiếm tiêu đề hoặc nội dung..."
              class="w-full bg-[#0c1628] border border-[#244170] rounded-lg pl-8 pr-3 py-1.5 text-xs text-slate-100 placeholder-slate-400 focus:outline-none focus:border-[#1677ff] font-sans" />
            <svg class="notes-search-icon w-3.5 h-3.5 text-slate-400 absolute left-2.5 top-2.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
            </svg>
          </div>

          <!-- Category filter pills -->
          <div class="flex flex-wrap gap-1 text-[11px] font-sans" id="notesFilterPills">
            <button type="button" id="noteFilter_all" onclick="setNoteCategoryFilter('all')"
              class="notes-filter-pill is-active px-2.5 py-1 rounded-full font-medium transition cursor-pointer">
              Tất cả (<span id="notesCountAll">0</span>)
            </button>
            <button type="button" id="noteFilter_general" onclick="setNoteCategoryFilter('general')"
              class="notes-filter-pill px-2.5 py-1 rounded-full font-medium transition cursor-pointer">
              Chung
            </button>
            <button type="button" id="noteFilter_tech" onclick="setNoteCategoryFilter('tech')"
              class="notes-filter-pill px-2.5 py-1 rounded-full font-medium transition cursor-pointer">
              Kỹ thuật
            </button>
            <button type="button" id="noteFilter_git" onclick="setNoteCategoryFilter('git')"
              class="notes-filter-pill px-2.5 py-1 rounded-full font-medium transition cursor-pointer">
              Git
            </button>
            <button type="button" id="noteFilter_deploy" onclick="setNoteCategoryFilter('deploy')"
              class="notes-filter-pill px-2.5 py-1 rounded-full font-medium transition cursor-pointer">
              Deploy
            </button>
            <button type="button" id="noteFilter_jira" onclick="setNoteCategoryFilter('jira')"
              class="notes-filter-pill px-2.5 py-1 rounded-full font-medium transition cursor-pointer">
              Jira
            </button>
          </div>
        </div>

        <!-- Notes List Container -->
        <div id="notesListContainer" class="space-y-1.5 max-h-[580px] overflow-y-auto custom-scrollbar pr-1">
          <!-- Populated by JavaScript -->
        </div>
      </div>

      <!-- Right Panel: Editor ghi chú (8 cols) -->
      <div class="notes-panel lg:col-span-8 bg-[#101e38] border border-[#244170] rounded-xl p-4 md:p-5 space-y-3.5 shadow-sm flex flex-col">
        <!-- Title & Status Row -->
        <div class="notes-meta-box space-y-2 border-b border-[#244170]/70 pb-3">
          <div class="flex items-center justify-between gap-3">
            <input type="text" id="noteTitleInput" oninput="onNoteTitleInput(this.value)"
              placeholder="Nhập tiêu đề ghi chú..."
              class="flex-1 bg-transparent text-white font-bold font-sans text-base md:text-lg focus:outline-none placeholder-slate-500" />
            <div class="flex items-center gap-1.5 shrink-0">
              <span id="noteAutoSaveBadge"
                class="text-[11px] font-sans font-medium px-2 py-0.5 rounded-full bg-emerald-950/70 text-emerald-300 border border-emerald-800">
                Đã lưu
              </span>
            </div>
          </div>

          <!-- Metadata row: Category + Jira Key -->
          <div class="flex flex-wrap items-center gap-2.5 pt-1 text-xs">
            <div class="flex items-center gap-1.5 shrink-0">
              <span class="notes-meta-label text-slate-400 font-sans">Chuyên mục:</span>
              <select id="noteCategorySelect" onchange="onNoteCategoryChange(this.value)"
                class="bg-[#0c1628] border border-[#244170] text-slate-200 rounded px-2 py-1 text-xs font-sans focus:outline-none focus:border-[#1677ff] cursor-pointer">
                <option value="general">Ghi chú chung</option>
                <option value="tech">Lưu ý kỹ thuật & Logic</option>
                <option value="api">API & Cơ sở dữ liệu</option>
                <option value="deploy">Deployment (Triển khai)</option>
                <option value="git">Git & Quản lý nhánh</option>
                <option value="checklist">Danh sách kiểm tra (Checklist)</option>
                <option value="jira">Jira Ticket & Sprint</option>
              </select>
            </div>

            <div class="flex items-center gap-1.5 flex-1 min-w-[240px]">
              <span class="notes-meta-label text-slate-400 font-sans shrink-0">Liên kết Jira:</span>
              <div class="flex items-center gap-1 flex-1 min-w-0">
                <input type="text" id="noteJiraKeyInput" oninput="onNoteJiraKeyInput(this.value)"
                  placeholder="Mã Ticket (VD: EAS-12373) hoặc link Jira..."
                  class="flex-1 min-w-0 bg-[#0c1628] border border-[#244170] text-slate-200 rounded px-2.5 py-1 text-xs font-mono focus:outline-none focus:border-[#1677ff]" />
                <a id="noteJiraKeyLinkBtn" href="#" target="_blank" rel="noopener noreferrer"
                  class="hidden px-2 py-1 rounded bg-[#1677ff]/20 hover:bg-[#1677ff]/30 text-blue-400 border border-blue-500/30 text-[11px] font-sans items-center gap-1 shrink-0 transition cursor-pointer"
                  title="Mở liên kết Jira trong tab mới">
                  <span>Mở</span>
                  <svg class="w-3 h-3" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/>
                  </svg>
                </a>
              </div>
            </div>
          </div>
        </div>

        <!-- Markdown Quick Formatting Toolbar -->
        <div id="notesMarkdownToolbar" class="notes-markdown-toolbar flex flex-wrap items-center gap-1 p-1.5 rounded-lg border text-xs">
          <button type="button" onclick="insertNoteMarkdown('**', '**', 'văn bản in đậm')"
            class="notes-toolbar-btn px-2.5 py-1 rounded font-bold transition cursor-pointer" title="In đậm (Bold)">
            B
          </button>
          <button type="button" onclick="insertNoteMarkdown('*', '*', 'văn bản in nghiêng')"
            class="notes-toolbar-btn px-2.5 py-1 rounded italic transition cursor-pointer" title="In nghiêng (Italic)">
            I
          </button>
          <button type="button" onclick="insertNoteMarkdown('### ', '', 'Tiêu đề mục')"
            class="notes-toolbar-btn px-2.5 py-1 rounded font-semibold transition cursor-pointer" title="Tiêu đề (Heading)">
            H3
          </button>
          <div class="notes-toolbar-divider w-px h-4 mx-1"></div>
          <button type="button" onclick="insertNoteMarkdown('`', '`', 'code')"
            class="notes-toolbar-btn px-2.5 py-1 rounded font-mono text-[11px] transition cursor-pointer" title="Mã nội dòng (Inline Code)">
            &lt;/&gt;
          </button>
          <button type="button" onclick="insertNoteMarkdown('```\n', '\n```', '// đoạn mã code')"
            class="notes-toolbar-btn px-2.5 py-1 rounded font-mono text-[11px] transition cursor-pointer" title="Khối code (Code Block)">
            Khối code
          </button>
          <button type="button" onclick="insertNoteMarkdown('- [ ] ', '', 'Công việc cần làm')"
            class="notes-toolbar-btn px-2.5 py-1 rounded transition cursor-pointer flex items-center gap-1" title="Checklist công việc">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
            <span>Checklist</span>
          </button>
          <button type="button" onclick="insertNoteMarkdown('- ', '', 'Mục danh sách')"
            class="notes-toolbar-btn px-2.5 py-1 rounded transition cursor-pointer" title="Danh sách dấu chấm">
            • Danh sách
          </button>
          <button type="button" onclick="insertNoteMarkdown('> ', '', 'Nội dung trích dẫn')"
            class="notes-toolbar-btn px-2.5 py-1 rounded transition cursor-pointer" title="Trích dẫn (Quote)">
            &ldquo; Trích dẫn
          </button>
          <button type="button" onclick="insertNoteMarkdown('| Cột 1 | Cột 2 |\n| --- | --- |\n| Giá trị 1 | Giá trị 2 |', '', '')"
            class="notes-toolbar-btn px-2.5 py-1 rounded transition cursor-pointer" title="Bảng dữ liệu (Table)">
            Bảng
          </button>
        </div>

        <!-- Main Editor Textarea -->
        <div class="flex-1 flex flex-col min-h-[460px]">
          <textarea id="noteContentInput" oninput="onNoteContentInput(this.value)"
            placeholder="Viết ghi chú, lưu ý kỹ thuật, checklist thực hiện, endpoint API hoặc thông tin dự án...&#10;- Hỗ trợ Markdown đầy đủ.&#10;- Bấm 'Đưa vào Tác vụ' để chuyển ghi chú sang Prompt của Agent ngay lập tức."
            class="w-full flex-1 min-h-[460px] bg-[#0c1628] border border-[#244170] rounded-xl p-4 text-[13px] text-slate-100 placeholder-slate-500 focus:outline-none focus:border-[#1677ff] font-sans leading-relaxed resize-y custom-scrollbar"></textarea>
        </div>

        <!-- Footer Stats Bar -->
        <div id="notesFooterStats" class="notes-footer-stats flex items-center justify-between text-xs text-slate-400 pt-2 border-t border-[#244170]/70 font-sans">
          <div class="flex items-center gap-3">
            <span id="noteWordCount">0 từ</span>
            <span>•</span>
            <span id="noteCharCount">0 ký tự</span>
          </div>
          <div class="flex items-center gap-1.5 text-[11px]">
            <span>Cập nhật lần cuối:</span>
            <span id="noteLastModified" class="text-slate-300 font-medium">Chưa có</span>
          </div>
        </div>
      </div>
    </div>
  </main>
